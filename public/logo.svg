<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 824">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d7bff"/>
      <stop offset="0.5" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect width="824" height="824" rx="184" fill="url(#sheen)"/>
  <!-- token: a hexagonal coin -->
  <polygon points="412,150 639,281 639,543 412,674 185,543 185,281"
           fill="#ffffff" fill-opacity="0.07"
           stroke="#ffffff" stroke-opacity="0.92" stroke-width="44" stroke-linejoin="round"/>
  <!-- usage: rising bars, today's in amber -->
  <rect x="278" y="430" width="72" height="130" rx="18" fill="url(#bar)"/>
  <rect x="376" y="360" width="72" height="200" rx="18" fill="url(#bar)"/>
  <rect x="474" y="280" width="72" height="280" rx="18" fill="url(#hot)"/>
</svg>
